<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ .CSRFToken }}">
<title>Emby Users Panel - Login</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="login-mode">

<div class="card login-card">
    <h2 class="login-title">Emby Panel Login</h2>
    <form onsubmit="event.preventDefault(); doLogin();" autocomplete="off">
        <div class="field login-field">
            <div class="label">访问密码</div>
            <div class="input password-container">
                <div class="icon"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon-svg"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg></div>
                <input type="password" id="loginPass" placeholder="请输入密码" required autocomplete="current-password">
                <button type="button" class="btn-eye" onclick="togglePasswordVisibility(this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon-svg"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-lg btn-submit login-submit">登录</button>
    </form>
</div>
<script src="assets/script.js?v={{ .AssetVersion }}"></script>
</body>
</html>
